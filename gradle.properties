# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18.1

# Mod Properties
version=1.0.1
group=com.itsthejimjam.realcamera

# Dependencies
fabric_api_version=0.160.5+26.3
cloth_config_version=26.3.158
# No 26.3 build published yet (checked Modrinth) — left on the last 26.2 build; JEI is a
# soft/optional dependency (see build.gradle), so this only risks the JEI integration
# specifically, not the mod as a whole. Bump once JEI ships a 26.3 release.
jei_version=30.32.0.221
# Only a pre-release targets 26.3 so far (checked Modrinth) — modmenu is also a soft/
# optional dependency. Swap for a stable release once one ships.
modmenu_version=21.0.0-beta.1
