// 1.21.1 is an obfuscated version, so this uses Loom's remapping plugin (fabric-loom-remap):
// mod dependencies go through modImplementation and get remapped to Mojang names.
plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Cloth Config (config-screen builder) and Mod Menu (the "Configure" button).
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.terraformersmc.com/releases/" }
	// JEI (Camera Workbench recipe category).
	maven { url "https://api.modrinth.com/maven" }
}

// Mod Menu / Cloth Config for 1.21.1 were published against an older Fabric Loader and drag
// its Mixin (0.15) / MixinExtras (0.4) onto the dev classpath, where they clash with Loader
// 0.19's ("NoClassDefFoundError: IAdviceProvider" on runClient). Pin the versions Loader 0.19
// ships with. Dev-environment only — nothing here ends up in the mod jar.
configurations.configureEach {
	resolutionStrategy {
		force "net.fabricmc:sponge-mixin:0.17.4+mixin.0.8.7"
		force "io.github.llamalad7:mixinextras-fabric:0.5.5"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"realcamera" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"


	// Fabric API. This is technically optional, but you probably want it anyway.
	// modImplementation (not plain implementation) — this is an obfuscated Minecraft
	// version, so Loom must remap the mod jar's intermediary-named internals to match
	// our compile mappings; plain `implementation` skips that step.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Compiled and dev-run against, only *suggested* at ship time (see fabric.mod.json):
	// the settings screen shows when both are installed; config still loads/saves without.
	modImplementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
	// JEI — the workbench recipe category. Soft dependency; the @JeiPlugin class only
	// loads when JEI is present.
	modCompileOnly "maven.modrinth:jei:${project.jei_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

// Loom 1.18 needs Gradle itself on JDK 25, but 1.21.1 players run Java 21 — launch the dev
// client (runClient / runServer) on 21 so it behaves like the real thing.
tasks.withType(JavaExec).configureEach {
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
