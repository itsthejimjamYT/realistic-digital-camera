// Applied the legacy buildscript/apply-plugin way (not `plugins { id 'net.fabricmc.fabric-loom' }`)
// on purpose: the modern plugins{} DSL resolves loom through a Gradle Plugin Portal marker
// artifact, and that marker makes loom's own PluginManager.hasPlugin() self-check see the
// plugin as "already applied" before its extension finishes constructing — which makes loom
// wrongly treat this obfuscated version as if it needed no remapping (Mojang mappings/`mappings`
// config disappear with "non-obfuscated environment" errors). Applying it this way sidesteps
// the marker entirely and remapping works correctly.
buildscript {
	repositories {
		maven { url = 'https://maven.fabricmc.net/' }
		mavenCentral()
		gradlePluginPortal()
	}
	dependencies {
		classpath "net.fabricmc:fabric-loom:${loom_version}"
	}
}

apply plugin: 'fabric-loom'
apply plugin: 'maven-publish'

loom {
	splitEnvironmentSourceSets()

	mods {
		"realcamera" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric Loader bundles Mixin internally at runtime, but this legacy-applied Loom
	// (see the note up top) doesn't auto-add it to the compile classpath the way the
	// modern plugins{} DSL does for the 26.2 sibling project — declare it explicitly so
	// @Mixin/@Inject/@Shadow resolve. compileOnly: the real implementation comes from
	// fabric-loader at runtime, so this must not also ship on the runtime classpath.
	compileOnly "net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7"

	// Fabric API. This is technically optional, but you probably want it anyway.
	// modImplementation (not plain implementation) — this is an obfuscated Minecraft
	// version, so Loom must remap the mod jar's intermediary-named internals to match
	// our compile mappings; plain `implementation` skips that step.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Cloth Config / Mod Menu / JEI intentionally not added yet — pinning to versions
	// compatible with 1.20.4 comes once the core mod loads on this version.
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
